<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explore Manila Chamber of Commerce membership options and learn how to apply.">
    <meta name="author" content="Aaron J Evan M. Tolentino">
    <title>Join | Manila Chamber of Commerce</title>
    <link rel="stylesheet" href="styles/chamber.css">
    <link rel="stylesheet" href="../styles/normalize.css">
    <link rel="icon" href="images/chamber-favicon.ico" sizes="32x32">
    <script src="scripts/join.js" defer></script>
</head>

<body>
    <header>
        <p>Manila Chamber of Commerce</p>
        <nav aria-label="Chamber navigation">
            <a href="index.html">Home</a>
            <a href="discover.html">Discover</a>
            <a href="directory.html">Directory</a>
            <a href="join.html" aria-current="page">Join</a>
        </nav>
    </header>

    <main>
        <h1>Join the Chamber</h1>
        <p>Connect with Manila businesses and find a membership that fits your organization.</p>

        <section>
            <h2>Membership Levels</h2>
            <ul>
                <li>Nonprofit</li>
                <li>Silver</li>
                <li>Gold</li>
            </ul>
        </section>

        <section>
            <h2>Membership Application</h2>

            <form action="thankyou.html" method="get">
                <p>
                    <label for="first-name">
                        First name
                        <input type="text" id="first-name" name="firstName" autocomplete="given-name"
                            title="Enter your first name" required>
                    </label>
                </p>
                <p>
                    <label for="last-name">
                        Last name
                        <input type="text" id="last-name" name="lastName" autocomplete="family-name"
                            title="Enter your last name" required>
                    </label>
                </p>
                <p>
                    <label for="organization-title">
                        Organizational title (optional)
                        <input type="text" id="organization-title" name="organizationTitle"
                            autocomplete="organization-title" pattern="[A-Za-z \-]{7,}"
                            title="Enter at least 7 characters using letters, spaces, or hyphens.">
                    </label>
                </p>
                <p>
                    <label for="organization">
                        Business or organization name
                        <input type="text" id="organization" name="organization" autocomplete="organization"
                            title="Enter your business or organization name" required>
                    </label>
                </p>
                <p>
                    <label for="email">
                        Email address
                        <input type="email" id="email" name="email" autocomplete="email"
                            title="Enter your email address" placeholder="name@example.com" required>
                    </label>
                </p>
                <p>
                    <label for="phone">
                        Mobile phone
                        <input type="tel" id="phone" name="phone" autocomplete="tel"
                            title="Enter your mobile phone number" required>
                    </label>
                </p>
                <p>
                    <label for="membership">
                        Membership level
                        <select id="membership" name="membership" title="Choose a membership level" required>
                            <option value="">Choose a level</option>
                            <option value="np">NP Membership (no fee)</option>
                            <option value="bronze">Bronze Membership</option>
                            <option value="silver">Silver Membership</option>
                            <option value="gold">Gold Membership</option>
                        </select>
                    </label>
                </p>
                <p>
                    <label for="description">
                        Tell us about your organization
                        <textarea id="description" name="description" rows="4"
                            title="Describe your business or organization"></textarea>
                    </label>
                </p>

                <input type="hidden" id="timestamp" name="timestamp">
                <input type="submit" value="Submit Application">
            </form>
        </section>
    </main>

    <footer>
        <p>Manila Chamber of Commerce | WDD 231 Project</p>
    </footer>
</body>

</html>
